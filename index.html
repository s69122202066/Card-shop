<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Store - ร้านขายการ์ดเกม</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- แถบเมนูด้านบน -->
    <header>
        <div class="logo">TCG Store</div>
        <nav>
            <a href="#products">สินค้าทั้งหมด</a>
            <a href="#contact">ติดต่อเรา</a>
        </nav>
        <div class="cart">🛒 ตะกร้า (<span id="cart-count">0</span>)</div>
    </header>

    <main>
        <!-- ส่วนเลือกหมวดหมู่ -->
        <section id="categories">
            <h2>หมวดหมู่การ์ดเกม</h2>
            <div class="category-buttons">
                <button class="cat-btn active" onclick="filterSelection('all', event)">ทั้งหมด</button>
                <button class="cat-btn" onclick="filterSelection('pokemon', event)">โปเกมอน</button>
                <button class="cat-btn" onclick="filterSelection('yugioh', event)">ยูกิโอ</button>
                <button class="cat-btn" onclick="filterSelection('accessories', event)">อุปกรณ์เสริม</button>
            </div>
        </section>

        <!-- ส่วนแสดงสินค้า -->
        <section id="products">
            <div class="product-grid">
                <!-- สินค้า 1: โปเกมอน -->
                <div class="card filter-item pokemon">
                    <img src="pikachu.jpg" alt="Pokemon">
                    <h3>พิคาชู VMAX</h3>
                    <p class="price">850 บาท</p>
                    <button class="add-btn" onclick="addToCart()">เพิ่มลงตะกร้า</button>
                </div>
                <!-- สินค้า 2: ยูกิโอ -->
                <div class="card filter-item yugioh">
                    <img src="blue-eyes-white-dragon.jpg" alt="Yugioh">
                    <h3>บลูอายส์ ไวท์ดราก้อน</h3>
                    <p class="price">1,200 บาท</p>
                    <button class="add-btn" onclick="addToCart()">เพิ่มลงตะกร้า</button>
                </div>
                <!-- สินค้า 3: อุปกรณ์เสริม -->
                <div class="card filter-item accessories">
                    <img src="card-sleeves.jpg" alt="Sleeves">
                    <h3>ซองใส่การ์ด (สีดำ)</h3>
                    <p class="price">150 บาท</p>
                    <button class="add-btn" onclick="addToCart()">เพิ่มลงตะกร้า</button>
                </div>
            </div>
        </section>

        <hr>

        <!-- ส่วนติดต่อเรา -->
        <section id="contact">
            <h2>ติดต่อเรา</h2>
            <div class="contact-box">
                <p><strong>Facebook:</strong> TCG Store Thailand</p>
                <p><strong>Line OA:</strong> @tcgstore</p>
                <form class="contact-form" onsubmit="event.preventDefault(); alert('ส่งข้อความสำเร็จ! เราจะรีบติดต่อกลับครับ');">
                    <input type="text" placeholder="ชื่อของคุณ" required>
                    <input type="email" placeholder="อีเมลสำหรับติดต่อกลับ" required>
                    <textarea placeholder="ข้อความที่ต้องการสอบถาม..." rows="4" required></textarea>
                    <button type="submit" class="submit-btn">ส่งข้อความ</button>
                </form>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
