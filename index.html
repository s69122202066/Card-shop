<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Store - ร้านขายการ์ดเกม</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- แถบเมนูด้านบน -->
    <header>
        <div class="logo">TCG Store</div>
        <nav>
            <a href="#products">สินค้าทั้งหมด</a>
            <a href="#contact">ติดต่อเรา</a>
        </nav>
        <div class="cart">🛒 ตะกร้า (<span id="cart-count">0</span>)</div>
    </header>

    <main>
        <!-- ส่วนเลือกหมวดหมู่ -->
        <section id="categories">
            <h2>categories</h2>
            <div class="category-buttons">
                <button class="cat-btn active" onclick="filterSelection('all', event)">all</button>
                <button class="cat-btn" onclick="filterSelection('pokemon', event)">pokemon</button>
                <button class="cat-btn" onclick="filterSelection('yugioh', event)">Yu-Gi-Oh</button>
                <button class="cat-btn" onclick="filterSelection('onepiece', event)">one-piece</button>
                <button class="cat-btn" onclick="filterSelection('accessories', event)">accessories</button>
            </div>
        </section>

        <!-- ส่วนแสดงสินค้า -->
        <section id="products">
            <div class="product-grid"> <!-- แก้ไขแล้ว: เติมคำว่า div -->
                <!-- สินค้า 1: pokemon -->
                <div class="card filter-item pokemon">
                    <img src="pikachu.jpg" alt="Pokemon">
                    <h3>Pokemon</h3>
                    <p class="price">1,200 บาท</p>
                    <button class="add-btn" onclick="addToCart()">เพิ่มลงตะกร้า</button>
                </div>
                <!-- สินค้า 2: yugioh -->
                <div class="card filter-item yugioh"> <!-- แก้ไขแล้ว: เปลี่ยนเป็น yugioh ให้ตรงกับปุ่ม -->
                    <img src="blue-eyes-white-dragon.jpg" alt="Yu-Gi-Oh">
                    <h3>Yu-Gi-Oh</h3>
                    <p class="price">1,300 บาท</p>
                    <button class="add-btn" onclick="addToCart()">เพิ่มลงตะกร้า</button>
                </div>
                <!-- สินค้า 3: onepiece -->
                <div class="card filter-item onepiece"> <!-- แก้ไขแล้ว: เปลี่ยนเป็น onepiece ให้ตรงกับปุ่ม -->
                    <img src="one-piece.jpg" alt="one-piece">
                    <h3>one-piece</h3>
                    <p class="price">1,500 บาท</p>
                    <button class="add-btn" onclick="addToCart()">เพิ่มลงตะกร้า</button>
                </div>
                <!-- สินค้า 4: accessories -->
                <div class="card filter-item accessories">
                    <img src="card-sleeves.jpg" alt="sleeves">
                    <h3>Card-sleeves</h3>
                    <p class="price">150 บาท</p>
                    <button class="add-btn" onclick="addToCart()">เพิ่มลงตะกร้า</button>
                </div>
            </div> <!-- แก้ไขแล้ว: เติมแท็กปิด </div> -->
        </section>

        <hr>

        <!-- ส่วนติดต่อเรา -->
        <section id="contact">
            <h2>ติดต่อเรา</h2>
            <div class="contact-box">
                <p><strong>Facebook:</strong> TCG Store Thailand</p>
                <p><strong>Line OA:</strong> @tcgstore</p>
                <form class="contact-form" onsubmit="event.preventDefault(); alert('ส่งข้อความสำเร็จ! เราจะรีบติดต่อกลับครับ');">
                    <input type="text" placeholder="ชื่อของคุณ" required>
                    <input type="email" placeholder="อีเมลสำหรับติดต่อกลับ" required>
                    <textarea placeholder="ข้อความที่ต้องการสอบถาม..." rows="4" required></textarea>
                    <button type="submit" class="submit-btn">ส่งข้อความ</button>
                </form>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
